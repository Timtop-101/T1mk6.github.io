<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EspressA — кабинет сотрудника</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#10251a;color:#fff7e8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}a{color:#ffad66}.top{display:flex;align-items:center;justify-content:space-between}.panel{background:#f6f3e9;color:#182819;border-radius:24px;padding:24px;margin:24px 0}input,button,select{font:inherit;padding:12px;border-radius:12px;border:1px solid #c8d0c1}input{width:100%;margin-bottom:12px}button{background:#ff902c;color:#152218;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:default}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:15px}.order{background:white;color:#182819;padding:22px;border-radius:22px;box-shadow:0 3px 15px #0001}.order h3{margin-top:0}.order small{color:#687567}.details{white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#a12e27}.hidden{display:none}.badge{display:inline-block;background:#e3ebdb;padding:4px 10px;border-radius:15px}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{font-size:13px;padding:9px}.controls button.active{background:#244730;color:#fff}#auth{max-width:430px} .stats{display:flex;gap:18px;flex-wrap:wrap} .stats span{background:#264b35;padding:12px 20px;border-radius:14px}</style></head><body><div class="wrap"><div class="top"><h1>Espress<span style="color:#ff902c">A</span> · Сотрудники</h1><a href="./">← Меню</a></div><div id="setup" class="panel hidden"><h2>Ожидается настройка</h2><p>Для настоящего входа сотрудников и получения заказов нужно подключить Firebase, включить Authentication и Firestore и применить правила из файла firestore.rules. Инструкция — в SETUP.md.</p></div><section id="auth" class="panel hidden"><h2>Вход сотрудника</h2><form id="login"><label>Номер телефона<input id="phone" type="tel" inputmode="tel" autocomplete="username" placeholder="+7 700 123 45 67" minlength="10" maxlength="24" required></label><label>Пароль<input id="password" type="password" autocomplete="current-password" required></label><button>Войти</button></form><p id="authError" class="error" role="status"></p></section><section id="dashboard" class="hidden"><div class="top"><h2>Заказы в реальном времени</h2><button id="logout">Выйти</button></div><div class="stats" id="stats"></div><p id="message" role="status"></p><div id="orders" class="grid"></div></section></div><script src="./firebase-config.js"></script><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,doc,getDoc,collection,onSnapshot,orderBy,query,updateDoc} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const el=id=>document.getElementById(id), config=window.ESPRESSA_FIREBASE_CONFIG;
const escape=s=>String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));
const labels={new:"Новый",accepted:"Принят",preparing:"Готовится",ready:"Готов",completed:"Выдан",cancelled:"Отменён"};
if(!config?.apiKey||!config?.projectId||!config?.appId){el("setup").classList.remove("hidden");}else{
 const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);let unsub=()=>{};
 const loginEmail=phone=>{const digits=phone.replace(/\D/g,"");if(!/^\d{10,15}$/.test(digits))throw Error("Укажите номер из 10–15 цифр.");return digits+"@staff.espressa.example";};
 el("login").onsubmit=async e=>{e.preventDefault();el("authError").textContent="";try{const email=loginEmail(el("phone").value);await signInWithEmailAndPassword(auth,email,el("password").value)}catch(e){el("authError").textContent=e.message==="Укажите номер из 10–15 цифр."?e.message:({ "auth/invalid-credential":"Номер телефона или пароль не совпадает с аккаунтом Firebase. Проверьте, что технический email начинается с цифр номера.", "auth/invalid-email":"Неверный технический email. Проверьте номер аккаунта в Firebase.", "auth/operation-not-allowed":"В Firebase не включён Email/Password (Authentication → Sign-in method).", "auth/too-many-requests":"Слишком много попыток. Попробуйте позже.", "auth/network-request-failed":"Ошибка сети. Проверьте интернет и попробуйте ещё раз.", "auth/unauthorized-domain":"Добавьте timtop-101.github.io в разрешённые домены Firebase."}[e.code]||"Не удалось войти ("+(e.code||"неизвестная ошибка")+"). Проверьте номер телефона и пароль.")}};
 el("logout").onclick=()=>signOut(auth);
 onAuthStateChanged(auth,async user=>{unsub();el("dashboard").classList.add("hidden");el("auth").classList.add("hidden");if(!user){el("auth").classList.remove("hidden");return}
 try{const access=await getDoc(doc(db,"workers",user.uid));if(!access.exists()||access.data().active!==true){el("auth").classList.remove("hidden");el("authError").textContent="Аккаунт не назначен сотрудником. Обратитесь к администратору.";return;}
 el("dashboard").classList.remove("hidden");
 unsub=onSnapshot(query(collection(db,"orders"),orderBy("createdAt","desc")),snapshot=>{const orders=snapshot.docs.map(d=>({id:d.id,...d.data()}));el("stats").innerHTML='<span>Новые: '+orders.filter(o=>o.status==="new").length+'</span><span>В работе: '+orders.filter(o=>["accepted","preparing"].includes(o.status)).length+'</span><span>Всего: '+orders.length+'</span>';
 el("orders").innerHTML=orders.map(o=>'<article class="order"><h3>Заказ #'+escape(o.id.slice(0,8).toUpperCase())+' <small>'+escape(o.createdAt?.toDate?.()?.toLocaleString("ru-RU")||"только что")+'</small></h3><span class="badge">'+escape(labels[o.status]||o.status)+'</span><p class="details"><b>'+escape(o.name)+'</b> · '+escape(o.phone)+'<br>'+escape(o.delivery)+' '+escape(o.address)+'<br>'+escape(o.note)+'</p><p>'+ (Array.isArray(o.items)?o.items.map(x=>escape(x.name)+' × '+Number(x.qty)).join('<br>'):"")+'</p><h3>'+new Intl.NumberFormat("ru-RU").format(o.total||0)+' ₸</h3><div class="controls">'+Object.entries(labels).map(([key,label])=>'<button class="'+(o.status===key?'active':'')+'" data-order="'+escape(o.id)+'" data-status="'+key+'">'+label+'</button>').join('')+'</div></article>').join("")||'<p>Заказов пока нет.</p>';
 },err=>el("message").textContent="Ошибка получения заказов: "+err.message);
 }catch(e){el("authError").textContent="Нет доступа к заказам. Проверьте настройки.";el("auth").classList.remove("hidden");}});
 el("orders").addEventListener("click",async e=>{const b=e.target.closest("[data-order]");if(!b)return;b.disabled=true;try{await updateDoc(doc(db,"orders",b.dataset.order),{status:b.dataset.status});el("message").textContent="Статус обновлён."}catch(e){el("message").textContent="Ошибка изменения статуса."}finally{b.disabled=false}});
}
</script></body></html>
